<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cPanel Email - Detected</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background: white; padding: 60px 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; text-align: center; }
        .logo { font-size: 48px; margin-bottom: 20px; }
        h1 { color: #ff6b6b; margin-bottom: 15px; font-size: 28px; }
        .provider-name { color: #ff6b6b; font-weight: 600; font-size: 24px; margin-bottom: 30px; }
        .confidence { font-size: 14px; color: #666; margin-bottom: 20px; }
        .btn { background: #ff6b6b; color: white; border: none; padding: 14px 30px; border-radius: 6px; font-size: 16px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; transition: background 0.3s; }
        .btn:hover { background: #ee5a6f; }
        .info { background: #ffe0e0; padding: 20px; border-radius: 6px; margin-top: 20px; border-left: 4px solid #ff6b6b; text-align: left; }
        .info h3 { color: #ff6b6b; margin-bottom: 10px; }
        .info p { color: #666; font-size: 14px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚙️</div>
        <h1>Email Provider Detected</h1>
        <div class="provider-name">cPanel/WHM Email</div>
        <div class="confidence"><strong>Confidence:</strong> <span id="conf">82</span>%</div>
        <p id="domain" style="color: #666; margin-bottom: 20px;"></p>
        
        <div class="info">
            <h3>Detection Details</h3>
            <p><strong>Provider:</strong> cPanel/WHM Mail Server</p>
            <p><strong>Webmail Access:</strong> Port 2095/2096 or /webmail/</p>
            <p><strong>Mail Server:</strong> Exim or Postfix</p>
            <p><strong>Control Panel:</strong> cPanel/WHM</p>
        </div>
        
        <a href="" id="redirect" class="btn">Access Webmail</a>
    </div>
    
    <script>
        const params = new URLSearchParams(window.location.search);
        const domain = params.get('domain') || 'example.com';
        document.getElementById('conf').textContent = Math.round(params.get('confidence') || 82);
        document.getElementById('domain').textContent = 'Domain: ' + domain;
        document.getElementById('redirect').href = 'https://' + domain + ':2096/webmail';
    </script>
</body>
</html>
